<style>
/* Layout: one column report. Summary cards, pie charts (everyone, Ingrid, Ayson), then tables. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18221f; --muted:#5b6a66; --line:#d8dfdc;
  --accent:#2d5b4e; --accent-soft:#e0ebe7; --shadow:0 1px 2px rgba(20,30,28,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111816; --surface:#19231f; --ink:#e4ece9; --muted:#97a7a2; --line:#2b3a35;
    --accent:#86c7b2; --accent-soft:#1d312b; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19231f; --ink:#e4ece9; --muted:#97a7a2; --line:#2b3a35;
  --accent:#86c7b2; --accent-soft:#1d312b; --shadow:none; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 48px;padding-inline:16px;box-sizing:border-box}
*{box-sizing:border-box}
h1{font-size:28px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:18px;margin:0 0 6px;font-weight:700}
.caption{color:var(--muted);font-size:13px;margin:0 0 16px}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:14px;padding:6px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card .label{font-size:13px;color:var(--muted)}
.card .value{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.card.hi{border-color:var(--accent)}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin-bottom:18px;box-shadow:var(--shadow);min-width:0}
.pie-row{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:640px){.pie-row{grid-template-columns:1fr}}
.pie-row svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px;min-width:0}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend .nm{overflow-wrap:anywhere}
.legend .pc{color:var(--muted);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-bottom:0}
details{border-top:1px solid var(--line);padding:2px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;padding:12px 4px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:18px;margin-left:8px}
details[open] summary::after{content:"−"}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sname{font-weight:600}
.item-list{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 12px}
.item-list td{padding:7px 4px;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.p{background:transparent;border:1px solid var(--line);color:var(--muted)}
.notes{font-size:13px;color:var(--muted);padding-left:18px;margin:0}
.notes li{margin-bottom:6px}
</style>

const PALETTE = ["#2d5b4e","#c2703d","#4a6fa5","#8c5aa0","#d4a03a","#5f9d6e","#b04a5c","#3d9aa6","#7a6f5c","#6b7f3f","#a0527a","#5a6b8c"];
const OTHER_COLOR = "#9aa5a2";

let lang = "zh";
const fmt = n => n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const sum = arr => arr.reduce((a,b)=>a+b,0);

function compute(){
  const shared = ITEMS.filter(i=>i[4]==="S");
  const sharedTotal = sum(shared.map(i=>i[3]));
  const share = sharedTotal/2;
  const paidI = sum(shared.filter(i=>i[5]==="I").map(i=>i[3]));
  const paidA = sum(shared.filter(i=>i[5]==="A").map(i=>i[3]));
  const persI = sum(ITEMS.filter(i=>i[4]==="P").map(i=>i[3]));
  const flightEach = sum(ITEMS.filter(i=>i[4]==="F").map(i=>i[3]))/2;
  const grand = sum(ITEMS.map(i=>i[3]));
  return {
    sharedTotal, share, paidI, paidA, persI, flightEach,
    totalI: share+persI+flightEach,
    totalA: share+flightEach,
    owe: paidA - share,
    grand
  };
}

function catTotals(){
  const m = {};
  ITEMS.forEach(i=>{
    if(!m[i[2]]) m[i[2]] = {v:0,n:0,key:i[2]};
    m[i[2]].v += i[3]; m[i[2]].n++;
  });
  return Object.values(m).sort((a,b)=>b.v-a.v);
}

// Spend per category for one person.
// Shared items and flights are split in half; personal items belong to the payer only.
function personCats(who){
  const m = {};
  ITEMS.forEach(i=>{
    let v = 0;
    if(i[4]==="S" || i[4]==="F") v = i[3]/2;
    else if(i[4]==="P" && who==="I") v = i[3];
    if(v>0) m[i[2]] = (m[i[2]]||0) + v;
  });
  return Object.entries(m).map(([key,v])=>({key, v}));
}

// Pie chart: rows are {label, v}. Slices under 2% of the total are merged into "Other".
function pie(rows, total, ariaLabel){
  rows = [...rows].sort((a,b)=>b.v-a.v);
  const main = rows.filter(r=>r.v/total >= 0.02);
  const rest = rows.filter(r=>r.v/total < 0.02);
  const slices = main.map((r,i)=>({label:r.label, v:r.v, color:PALETTE[i % PALETTE.length]}));
  if(rest.length){
    slices.push({label:T[lang].others, v:sum(rest.map(r=>r.v)), color:OTHER_COLOR});
  }
  const cx=150, cy=150, r=140;
  let angle = -Math.PI/2, paths = "";
  slices.forEach(s=>{
    const frac = s.v/total;
    const title = `<title>${s.label}: ${fmt(s.v)} (${(frac*100).toFixed(1)}%)</title>`;
    if(frac > 0.9999){
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${s.color}" stroke="var(--surface)" stroke-width="2">${title}</circle>`;
      return;
    }
    const a2 = angle + frac*2*Math.PI;
    const x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);
    const x2 = cx + r*Math.cos(a2), y2 = cy + r*Math.sin(a2);
    const large = frac > 0.5 ? 1 : 0;
    paths += `<path d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${s.color}" stroke="var(--surface)" stroke-width="2">${title}</path>`;
    angle = a2;
  });
  const svg = `<svg viewBox="0 0 300 300" role="img" aria-label="${ariaLabel}">${paths}</svg>`;
  const legend = slices.map(s=>`
    <li><span class="sw" style="background:${s.color}"></span>
      <span class="nm">${s.label}</span>
      <span class="num">${fmt(s.v)}</span>
      <span class="pc">${(s.v/total*100).toFixed(1)}%</span></li>`).join("");
  return `<div class="pie-row">${svg}<ul class="legend">${legend}</ul></div>`;
}

function render(){

  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));

  const c = compute();

  const typeName = {S:t.typeS, P:t.typeP, F:t.typeF};

  const cards = `
    <div class="cards">
      <div class="card"><div class="label">${t.shared}</div><div class="value">${fmt(c.sharedTotal)}</div><div class="sub">${t.each} ${fmt(c.share)}</div></div>
      <div class="card hi"><div class="label">${t.ingrid}</div><div class="value">${fmt(c.totalI)}</div><div class="sub">TWD</div></div>
      <div class="card hi"><div class="label">${t.ayson}</div><div class="value">${fmt(c.totalA)}</div><div class="sub">TWD</div></div>
      <div class="card"><div class="label">${t.settle}</div><div class="value">${fmt(c.owe)}</div><div class="sub">${t.settleTxt}</div></div>
    </div>`;

  const allRows = cats.map(k=>({label:CATS[k.key][lang], v:k.v}));
  const pieAllSec = `<section><h2>${t.pieAll}</h2>${pie(allRows, c.grand, t.pieAll)}</section>`;

  const labelOf = k => ({label:CATS[k.key][lang], v:k.v});
  const pieISec = `<section><h2>${t.pieI}</h2><p class="caption">${t.capI}</p>${pie(personCats("I").map(labelOf), c.totalI, t.pieI)}</section>`;
  const pieASec = `<section><h2>${t.pieA}</h2><p class="caption">${t.capA}</p>${pie(personCats("A").map(labelOf), c.totalA, t.pieA)}</section>`;

  const catRows = cats.map(k=>`
    <tr><td>${CATS[k.key][lang]}</td><td class="r">${k.n}</td><td class="r">${fmt(k.v)}</td><td class="r">${(k.v/c.grand*100).toFixed(1)}%</td></tr>`).join("");
  const catSec = `
    <section><h2>${t.catTitle}</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>${t.cat}</th><th class="r">${t.cnt}</th><th class="r">${t.amt}</th><th class="r">${t.pct}</th></tr></thead>
        <tbody>${catRows}
          <tr class="total"><td>${t.total}</td><td class="r">${ITEMS.length}</td><td class="r">${fmt(c.grand)}</td><td class="r">100%</td></tr>
        </tbody>
      </table></div>
    </section>`;

  const perSec = `
    <section><h2>${t.perTitle}</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>&nbsp;</th><th class="r">Ingrid</th><th class="r">Ayson</th></tr></thead>
        <tbody>
          <tr><td>${t.rShare}</td><td class="r">${fmt(c.share)}</td><td class="r">${fmt(c.share)}</td></tr>
          <tr><td>${t.rPaid}</td><td class="r">${fmt(c.paidI)}</td><td class="r">${fmt(c.paidA)}</td></tr>
          <tr><td>${t.rPers}</td><td class="r">${fmt(c.persI)}</td><td class="r">0.00</td></tr>
          <tr><td>${t.rFlight}</td><td class="r">${fmt(c.flightEach)}</td><td class="r">${fmt(c.flightEach)}</td></tr>
          <tr class="total"><td>${t.rTotal}</td><td class="r">${fmt(c.totalI)}</td><td class="r">${fmt(c.totalA)}</td></tr>
        </tbody>
      </table></div>
    </section>`;

  const detailSec = `<section><h2>${t.detailTitle}</h2>` + cats.map(k=>{
    const rows = ITEMS.filter(i=>i[2]===k.key).map(i=>`
      <tr>
        <td>${i[0]}</td>
        <td>${i[1]}</td>
        <td><span class="tag ${i[4]==="S"?"":"p"}">${typeName[i[4]]}</span></td>
        <td>${i[4]==="F" ? t.flightNote : (i[5]==="I" ? t.payI : t.payA)}</td>
        <td class="r">${fmt(i[3])}</td>
      </tr>`).join("");
    return `<details>
      <summary><span class="sname">${CATS[k.key][lang]}</span>
        <span class="muted">${k.n} ${t.items} · <span class="num">${fmt(k.v)}</span> TWD</span></summary>
      <div class="table-wrap"><table class="item-list"><tbody>${rows}</tbody></table></div>
    </details>`;
  }).join("") + `</section>`;

  const notes = `<section><h2>${t.notesTitle}</h2><ul class="notes">
    <li>${t.n1}</li><li>${t.n2}</li><li>${t.n3}</li><li>${t.n4}</li><li>${t.n5}</li></ul></section>`;

  document.getElementById("app").innerHTML = cards + pieAllSec + pieISec + pieASec + catSec + perSec + detailSec + notes;
}

document.querySelector(".lang").addEventListener("click", e=>{
  const b = e.target.closest("button[data-lang]");
  if(!b) return;
  lang = b.dataset.lang;
  render();
});

render();
</script>
